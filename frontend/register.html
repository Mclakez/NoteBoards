<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <script defer src="./js/auth.js" type="module"></script>
  <title>Create an account | NoteBoards</title>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="./index.html" aria-label="NoteBoards home"><img src="./images/NoteBoards.png" alt="NoteBoards" /></a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
    <div class="auth-intro"
    ><h1 id="register-title">Welcome to NoteBoards</h1>
    <p>Your memories and ideas deserve a home as unique as they are.</p>
  </div>
    <form class="auth-form" data-auth-form="register" novalidate>
      <div class="field">
        <label for="register-name">Full name</label>
        <input id="register-name" name="username" type="text" autocomplete="name" placeholder="Fadairo Marvellous" aria-describedby="register-name-error" />
        <p class="field-error" id="register-name-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="register-email">Email address</label>
        <input id="register-email" name="email" type="email" autocomplete="email" placeholder="Johndoe@gmail.com" aria-describedby="register-email-error" />
        <p class="field-error" id="register-email-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <div class="password-control">
          <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" aria-describedby="register-password-error" />
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><img src="./images/icons8-eye-50.png"></button>
        </div>
        <p class="field-error" id="register-password-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="register-confirm-password">Confirm password</label>
        <div class="password-control">
          <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" aria-describedby="register-confirm-password-error" />
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><img src="./images/icons8-eye-50.png"></button>
        </div>
        <p class="field-error" id="register-confirm-password-error" aria-live="polite"></p>
      </div>
      <button class="primary-button" type="submit">Create account</button>
    </form>

    <div class="divider" aria-hidden="true">or</div>

    <div class="social-buttons">
      <button class="social-button" type="button" data-provider="Google"><img src="./images/Frame 74.png" alt="" />Sign up with Google</button>
      <button class="social-button" type="button" data-provider="X"><img src="./images/twitter-x-seeklogo 1.png" alt="" />Sign up with X</button>
    </div>
    <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
  </section>
</main>
  <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
