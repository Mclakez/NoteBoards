<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <script defer src="./js/auth.js" type="module"></script>
  <title>Sign in | NoteBoards</title>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="./index.html" aria-label="NoteBoards home"><img src="./images/NoteBoards.png" alt="NoteBoards" /></a>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-intro">
      <h1 id="login-title">Welcome back to NoteBoards</h1>
      <p>Your memories and ideas deserve a home as unique as they are.</p>
    </div>
    <form class="auth-form" data-auth-form="login" novalidate>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="name" placeholder="John Doe" aria-describedby="login-username-error" />
        <p class="field-error" id="login-username-error" aria-live="polite"></p>
      </div>
      <div class="field">

        
        <label for="login-password">Password</label>
        <div class="password-control">
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="login-password-error" />
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><img src="./images/icons8-eye-50.png"></button></div>
          <p class="field-error" id="login-password-error" aria-live="polite"></p>
        </div>
      <button class="primary-button" type="submit">Sign in</button>
    </form>

    <div class="divider" aria-hidden="true">or</div>

    <div class="social-buttons">
      <button class="social-button" type="button" data-provider="google"><img src="./images/Frame 74.png" alt="" />Continue with Google</button>
    </div>
    <p class="auth-switch">Don’t have an account? <a href="./register.html">Sign up</a></p>
  </section>
</main>
  <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
