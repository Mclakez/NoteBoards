<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sign In</title>
    <style>
      :root {
        --bg: #fffef0;
        --card: #ffffff;
        --text: #111111;
        --muted: #4d4d4d;
        --accent: #f0e500;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Geist, Arial, sans-serif;
        color: var(--text);
      }

      .status-card {
        width: min(90vw, 30rem);
        padding: 2rem 1.6rem;
        border: 2px solid var(--accent);
        border-radius: 1rem;
        background: var(--card);
        text-align: center;
        box-shadow: 0 10px 25px rgba(17, 17, 17, 0.05);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 3vw, 2.4rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="status-card" aria-live="polite">
      <h1>Google sign-in successful</h1>
      <p>Redirecting you to your notes…</p>
    </main>

    <script>
      setTimeout(() => {
        window.location.replace('./notes.html');
      }, 800);
    </script>
  </body>
</html>
